<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130">
  <defs>
    <style>
      .stroke { fill: none; stroke: #414042; stroke-width: 16; }
      .label  { font-family: MyriadPro-Regular, 'Myriad Pro', sans-serif;
                 font-size: 13px; fill: #414042; }
    </style>
  </defs>
  <g>
    <path class="stroke" d="M 45 80 L 80 30 L 115 80" stroke-linejoin="bevel"/>
