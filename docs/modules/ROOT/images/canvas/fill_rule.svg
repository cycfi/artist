<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190"
     font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <style>
      .fill  { fill: #1565c0; }
      .line  { fill: none; stroke: #5d5d5d; stroke-width: 1; }
      .label { font-size: 13px; fill: #1a1a1a; }
    </style>
  </defs>
  <!-- a self-intersecting five-pointed star, traced as one continuous path -->
  <g transform="translate(120,80)">
    <path class="fill" fill-rule="nonzero"
      d="M 0 -60 L 35 55 L -57 -18 L 57 -18 L -35 55 Z"/>
    <text class="label" x="0" y="95" text-anchor="middle">fill_winding</text>
  </g>
  <g transform="translate(360,80)">
    <path class="fill" fill-rule="evenodd"
      d="M 0 -60 L 35 55 L -57 -18 L 57 -18 L -35 55 Z"/>
    <text class="label" x="0" y="95" text-anchor="middle">fill_odd_even</text>
  </g>
</svg>
