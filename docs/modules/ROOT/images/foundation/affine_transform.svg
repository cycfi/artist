<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 0 398 170">
  <defs>
    <style>
      .m     { font-family: MyriadPro-Regular, 'Myriad Pro', sans-serif;
               font-size: 15px; fill: #414042; }
      .eq    { font-family: MyriadPro-Regular, 'Myriad Pro', sans-serif;
               font-size: 14px; fill: #414042; }
      .lbl   { font-family: MyriadPro-Regular, 'Myriad Pro', sans-serif;
               font-size: 12px; fill: #be1e2d; }
      .brk   { stroke: #414042; stroke-width: 1.5; fill: none; }
      .box   { stroke: #be1e2d; stroke-width: 1; fill: none;
               stroke-dasharray: 3 3; }
      .plate { fill: #e6e7e8; }
    </style>
  </defs>

  <rect class="plate" x="30" y="28" width="185" height="104" rx="3"/>

  <path class="brk" d="M 52,34 L 42,34 L 42,126 L 52,126"/>
  <path class="brk" d="M 193,34 L 203,34 L 203,126 L 193,126"/>

  <text class="m" x="72"  y="58" text-anchor="middle">a</text>
  <text class="m" x="122" y="58" text-anchor="middle">b</text>
  <text class="m" x="172" y="58" text-anchor="middle">0</text>

  <text class="m" x="72"  y="88" text-anchor="middle">c</text>
  <text class="m" x="122" y="88" text-anchor="middle">d</text>
  <text class="m" x="172" y="88" text-anchor="middle">0</text>

  <text class="m" x="72"  y="118" text-anchor="middle">tx</text>
  <text class="m" x="122" y="118" text-anchor="middle">ty</text>
  <text class="m" x="172" y="118" text-anchor="middle">1</text>

  <rect class="box" x="56" y="42" width="82" height="54"/>
  <rect class="box" x="56" y="102" width="82" height="22"/>

  <text class="lbl" x="97" y="22"  text-anchor="middle">linear part</text>
  <text class="lbl" x="97" y="150" text-anchor="middle">translation</text>

  <text class="eq" x="260" y="72">x' = a&#183;x + c&#183;y + tx</text>
  <text class="eq" x="260" y="98">y' = b&#183;x + d&#183;y + ty</text>
</svg>
