<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 258"
     font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <style>
      .lbl   { font-size: 11px; fill: #1a1a1a; }
      .axis  { font-size: 11px; fill: #5d5d5d; }
      .plate { fill: #f3f3f3; }
      .subj  { stroke: #1565c0; stroke-width: 2; fill: none; }
      .dot   { fill: #1565c0; }
      .ax    { stroke: #b0b0b0; stroke-width: 1;
               marker-end: url(#tip); }
      .guide { stroke: #cccccc; stroke-width: 1; stroke-dasharray: 5 3;
               fill: none; }
      .cons  { stroke: #5d5d5d; stroke-width: 1; stroke-dasharray: 3 3; }
      .ins   { stroke: #5d5d5d; stroke-width: 1.25; stroke-dasharray: 4 3;
               fill: none; }
      .lead  { stroke: #5d5d5d; stroke-width: 1; }
      .dim   { stroke: #5d5d5d; stroke-width: 1;
               marker-start: url(#a1); marker-end: url(#a2); }
      .dim1  { stroke: #5d5d5d; stroke-width: 1; marker-end: url(#a2); }
    </style>
    <marker id="a1" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 8,1 L 1,4 L 8,7 z" fill="#5d5d5d"/>
    </marker>
    <marker id="a2" viewBox="0 0 8 8" refX="1" refY="4"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0,1 L 7,4 L 0,7 z" fill="#5d5d5d"/>
    </marker>
    <marker id="tip" viewBox="0 0 8 8" refX="1" refY="4"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0,1 L 7,4 L 0,7 z" fill="#b0b0b0"/>
    </marker>
  </defs>

  <rect class="plate" x="6" y="6" width="548" height="246" rx="8"/>

  <line class="ax" x1="60" y1="46" x2="474" y2="46"/>
  <line class="ax" x1="60" y1="46" x2="60"  y2="236"/>
  <text class="axis" x="480" y="50">x</text>
  <text class="axis" x="60"  y="248" text-anchor="middle">y</text>

  <rect class="guide" x="197" y="80" width="136" height="136"/>

  <line class="cons" x1="265" y1="148" x2="265" y2="46"/>
  <line class="cons" x1="265" y1="148" x2="60"  y2="148"/>

  <line class="dim" x1="60" y1="30" x2="265" y2="30"/>
  <text class="lbl" x="162" y="26" text-anchor="middle">cx</text>
  <line class="dim" x1="42" y1="46" x2="42" y2="148"/>
  <text class="lbl" x="36" y="101" text-anchor="end">cy</text>

  <circle class="subj" cx="265" cy="148" r="68"/>
  <circle class="ins"  cx="265" cy="148" r="46"/>
  <circle class="dot"  cx="265" cy="148" r="3"/>

  <line class="dim1" x1="265" y1="148" x2="333" y2="148"/>
  <text class="lbl" x="299" y="139" text-anchor="middle">radius</text>

  <line class="lead" x1="404" y1="120" x2="303" y2="120"/>
  <text class="lbl" x="410" y="124">inset(x)</text>

  <line class="lead" x1="340" y1="80" x2="333" y2="80"/>
  <text class="lbl" x="346" y="84">bounds()</text>

  <line class="lead" x1="258" y1="166" x2="264" y2="152"/>
  <text class="lbl" x="254" y="170" text-anchor="end">center()</text>
</svg>
